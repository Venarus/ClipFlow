name: ClipFlow CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Windows 11 / .NET 9)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore ClipFlow.sln

      - name: Build Solution (Release)
        run: dotnet build ClipFlow.sln -c Release --no-restore

      - name: Run Automated Tests
        run: dotnet test ClipFlow.Tests\ClipFlow.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Publish Self-Contained App (win-x64)
        run: dotnet publish ClipFlow.App\ClipFlow.App.csproj -c Release -r win-x64 --self-contained true -o ./publish-ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ClipFlow.Tests/TestResults/test_results.trx

      - name: Upload Published Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-win-x64-Release
          path: ./publish-ci/ClipFlow.exe
