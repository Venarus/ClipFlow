<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Flow Ribbon Gradient -->
    <linearGradient id="flowRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Main Glass Clipboard Body -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="86" width="312" height="370" rx="36" fill="url(#glassBody)" stroke="url(#borderStroke)" stroke-width="2.5"/>

    <!-- Subtle inner surface highlight -->
    <rect x="102" y="88" width="308" height="120" rx="34" fill="#FFFFFF" fill-opacity="0.04"/>

    <!-- Top Metallic Clip Base -->
    <rect x="176" y="56" width="160" height="60" rx="16" fill="url(#accentBlue)" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="216" y="44" width="80" height="24" rx="8" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>

    <!-- Flow Lines inside clipboard (Simulating dynamic animated clipboard data stream) -->
    <!-- Line 1: Fluid wave -->
    <path d="M 150 180 C 200 160, 240 200, 310 175 C 340 165, 355 170, 362 175" 
          fill="none" stroke="url(#flowRibbon)" stroke-width="7" stroke-linecap="round" filter="url(#neonGlow)"/>

    <!-- Line 2: Middle Stream with pulses -->
    <path d="M 150 234 C 190 220, 230 250, 290 230 C 330 216, 350 230, 362 234" 
          fill="none" stroke="url(#accentBlue)" stroke-width="6" stroke-linecap="round"/>

    <!-- Line 3: Smart content markers (Color badge, Code snippet, Link) -->
    <rect x="150" y="286" width="60" height="24" rx="6" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="164" cy="298" r="4.5" fill="#38BDF8"/>
    <line x1="176" y1="298" x2="198" y2="298" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="222" y="286" width="70" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.25" stroke="#8B5CF6" stroke-width="1.5"/>
    <path d="M 234 294 L 230 298 L 234 302 M 244 294 L 248 298 L 244 302" stroke="#C4B5FD" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="256" y1="298" x2="280" y2="298" stroke="#DDD6FE" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="304" y="286" width="58" height="24" rx="6" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="316" cy="298" r="4" fill="#34D399"/>
    <line x1="326" y1="298" x2="350" y2="298" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Line 4: Flowing bottom ribbon -->
    <path d="M 150 354 C 210 338, 250 376, 320 350 C 342 342, 354 346, 362 350" 
          fill="none" stroke="url(#flowRibbon)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- Bottom Status Dots -->
    <circle cx="156" cy="406" r="4" fill="#22C55E"/>
    <line x1="172" y1="406" x2="270" y2="406" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="330" y1="406" x2="362" y2="406" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
